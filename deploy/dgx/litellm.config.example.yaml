# Example gateway configuration for a DGX host.
#
# Run one Qwen3.6 vLLM/SGLang server on localhost:8000, then expose only this
# gateway port to the Dashboard. The Dashboard never needs to know the backend
# URL or the underlying checkpoint name.

model_list:
  # The only DGX model for the initial deployment.
  - model_name: dgx-auto
    litellm_params:
      model: hosted_vllm/nvidia/Qwen3.6-35B-A3B-NVFP4
      api_base: http://127.0.0.1:8000/v1
      api_key: EMPTY

# For a gateway reachable beyond a trusted localhost network, enable an auth
# key and put the same value in backend/apis.local.json under api_keys.dgx:
# general_settings:
#   master_key: os.environ/DGX_GATEWAY_KEY

litellm_settings:
  request_timeout: 1800
  num_retries: 1
